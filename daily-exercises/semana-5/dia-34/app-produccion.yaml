apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: mi-app-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        ambiente: produccion
    spec:
      containers:
      - name: web
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: mi-app-prod
spec:
  selector:
    app: web-app
  ports:
  - port: 80
    nodePort: 30200
  type: NodePort
