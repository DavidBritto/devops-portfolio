apiVersion: v1
kind: Pod
metadata:
  name: hardened-vote-pod
  namespace: voting-app
  labels:
    app: vote-hardened
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: vote
      image: dockersamples/examplevotingapp_vote:before
      ports:
        - containerPort: 80
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  volumes:
    - name: tmp-volume
      emptyDir: {}
