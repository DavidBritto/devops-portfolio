apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-developer-sa
  namespace: voting-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: voting-app
  name: pod-reader-developer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-pod-binding
  namespace: voting-app
subjects:
  - kind: ServiceAccount
    name: dev-developer-sa
    namespace: voting-app
roleRef:
  kind: Role
  name: pod-reader-developer
  apiGroup: rbac.authorization.k8s.io
