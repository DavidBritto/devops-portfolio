apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: voting-app
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: voting-app
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 1000m
        memory: 1Gi
      min:
        cpu: 20m
        memory: 32Mi
