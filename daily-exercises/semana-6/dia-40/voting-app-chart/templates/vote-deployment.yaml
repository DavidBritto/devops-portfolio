apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vote
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount.vote }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: {{ .Values.images.vote }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.resources.vote | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vote
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.votePort }}
      targetPort: 80
      name: http
  selector:
    app: vote
