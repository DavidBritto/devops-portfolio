apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: voting-app
data:
  REDIS_HOST: "redis"
  DATABASE_HOST: "database"
  DATABASE_NAME: "votes"
  DATABASE_USER: "postgres"
  OPTION_A: "Cats"
  OPTION_B: "Dogs"
  APP_PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: voting-app
type: Opaque
stringData:
  DATABASE_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "votes"
